<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="poster.css">
</head>
<body>
  <main class="slide">
    <span class="number">02 / 04</span>
    <div class="eyebrow"><span class="dot"></span>解决的问题很具体</div>
    <h2>应用一多，<br><span class="accent">找软件就开始变慢</span></h2>
    <div class="problem-grid">
      <section class="panel problem">
        <h3>原来的麻烦</h3>
        <p>macOS 与 Parallels 应用分散；分类和顺序容易乱；启动台缺少适合长期维护的布局。</p>
      </section>
      <section class="panel solution">
        <h3>我的处理</h3>
        <p>分系统独立分类；文件夹、拖动排序、多项移动；保存多个布局，打乱后可恢复。</p>
      </section>
    </div>
    <div class="chips">
      <span class="chip">Windows 应用来自 Parallels 虚拟机</span>
      <span class="chip">自动分类审核</span>
      <span class="chip">深度卸载</span>
      <span class="chip">常用推荐</span>
    </div>
    <div class="window small"><img src="../screenshots/main.png" alt="应用分类界面"></div>
    <div class="bottom"><span class="brand">MacApp Box</span><span>免费开源 · 持续更新</span></div>
  </main>
</body>
</html>
